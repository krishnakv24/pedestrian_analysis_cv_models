services:
  model-converter:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./ParentModel:/models/ParentModel
      - ./OnnxModels:/models/OnnxModels
      - ./TensorRTModels:/models/TensorRTModels
      - ./convert.py:/workspace/convert.py
